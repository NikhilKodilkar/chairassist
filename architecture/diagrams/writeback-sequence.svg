<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <rect width="920" height="420" fill="#ffffff"/>
  <text x="460" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#111827" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Critical path: utterance to Open Dental mock</text>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#111827">
    <text x="80" y="64" text-anchor="middle" font-weight="600">Mic / VAD</text>
    <text x="250" y="64" text-anchor="middle" font-weight="600">Whisper worker</text>
    <text x="430" y="64" text-anchor="middle" font-weight="600">Lingo + parser</text>
    <text x="610" y="64" text-anchor="middle" font-weight="600">Exam store</text>
    <text x="800" y="64" text-anchor="middle" font-weight="600">OD mapper</text>
    <line x1="80" y1="76" x2="80" y2="400" stroke="#d1d5db"/>
    <line x1="250" y1="76" x2="250" y2="400" stroke="#d1d5db"/>
    <line x1="430" y1="76" x2="430" y2="400" stroke="#d1d5db"/>
    <line x1="610" y1="76" x2="610" y2="400" stroke="#d1d5db"/>
    <line x1="800" y1="76" x2="800" y2="400" stroke="#d1d5db"/>
    <line x1="80" y1="110" x2="250" y2="110" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="165" y="104" text-anchor="middle" font-size="11" fill="#2563eb">PCM clip</text>
    <line x1="250" y1="150" x2="430" y2="150" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="340" y="144" text-anchor="middle" font-size="11" fill="#2563eb">transcript</text>
    <line x1="430" y1="190" x2="610" y2="190" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="520" y="184" text-anchor="middle" font-size="11" fill="#2563eb">ChartEvent (high)</text>
    <line x1="610" y1="230" x2="800" y2="230" stroke="#ea580c" stroke-width="1.6" marker-end="url(#b)"/>
    <text x="705" y="224" text-anchor="middle" font-size="11" fill="#ea580c">applyEvent + map</text>
    <line x1="800" y1="270" x2="610" y2="270" stroke="#ea580c" stroke-width="1.6" marker-end="url(#b)"/>
    <text x="705" y="264" text-anchor="middle" font-size="11" fill="#ea580c">mocked HTTP calls</text>
    <line x1="610" y1="310" x2="430" y2="310" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="520" y="304" text-anchor="middle" font-size="11" fill="#6b7280">BroadcastChannel</text>
    <text x="460" y="350" text-anchor="middle" font-size="11" fill="#6b7280">Clinician grid, patient captions, and write-back panel update in the same origin</text>
    <text x="460" y="372" text-anchor="middle" font-size="11" fill="#6b7280">Low-confidence events stop at Heard. They never write the chart or PMS mapper.</text>
    <text x="460" y="402" text-anchor="middle" font-size="11" fill="#374151">No network call is made. The mapper builds the real Open Dental contract for display only.</text>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
  </defs>
</svg>
